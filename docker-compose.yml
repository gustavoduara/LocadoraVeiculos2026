# Sobe o sistema completo: SQL Server + aplicação (API e front na mesma imagem).
#   1. copie .env.example para .env e preencha os valores
#   2. docker compose up --build
# Acesse http://localhost:8080 (Swagger em /swagger, só com ASPNETCORE_ENVIRONMENT=Development)
services:
  banco:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}
    volumes:
      - dados-sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build: .
    depends_on:
      banco:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      APLICAR_MIGRACOES: "true"
      SQL_CONNECTION_STRING: Server=banco;Database=LocadoraVeiculos2026DB;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True
      JWT_GENERATION_KEY: ${JWT_GENERATION_KEY}
      JWT_AUDIENCE_DOMAIN: http://localhost:8080
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      LUCKYPENNY_LICENSE_KEY: ${LUCKYPENNY_LICENSE_KEY}
    ports:
      - "8080:8080"

volumes:
  dados-sql:
