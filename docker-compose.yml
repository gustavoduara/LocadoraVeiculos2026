# Sobe o sistema completo: SQL Server + API + front.
#   1. copie .env.example para .env e preencha os valores
#   2. docker compose up --build
# Front em http://localhost:4200 · API em http://localhost:9050 (Swagger em /swagger)
services:
  banco:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}
    volumes:
      - dados-sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: ./Server
    depends_on:
      banco:
        condition: service_healthy
    environment:
      # Em Development a API aplica as migrations ao subir e expõe o Swagger.
      ASPNETCORE_ENVIRONMENT: Development
      SQL_CONNECTION_STRING: Server=banco;Database=LocadoraVeiculos2026DB;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True
      JWT_GENERATION_KEY: ${JWT_GENERATION_KEY}
      JWT_AUDIENCE_DOMAIN: http://localhost:4200
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      LUCKYPENNY_LICENSE_KEY: ${LUCKYPENNY_LICENSE_KEY}
    ports:
      - "9050:8080"

  front:
    build: ./client
    depends_on:
      - api
    ports:
      - "4200:80"

volumes:
  dados-sql:
