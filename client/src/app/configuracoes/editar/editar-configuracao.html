<section class="mx-auto max-w-4xl px-4 py-6">
    <h2 class="text-2xl font-semibold">Configurações</h2>
    <hr class="my-4 border-muted/30" />

    <mat-card class="p-4 rounded-2xl shadow-sm">
        <form [formGroup]="configuracaoForm" (ngSubmit)="salvar()">
            <mat-card-header>
                <mat-card-title class="text-lg font-medium">Preço dos combustíveis</mat-card-title>
                <mat-card-subtitle>
                    Valor por litro, usado no cálculo do valor dos aluguéis.
                </mat-card-subtitle>
            </mat-card-header>

            <mat-card-content class="mt-6 grid grid-cols-1 sm:grid-cols-2 gap-4">
                @for (combustivel of combustiveis; track combustivel.campo) {
                <mat-form-field class="w-full">
                    <mat-label>{{ combustivel.rotulo }}</mat-label>
                    <span matTextPrefix>R$&nbsp;</span>
                    <input matInput type="number" step="0.01" min="0.01" max="999.99"
                        [formControlName]="combustivel.campo" />

                    @if (erroDo(combustivel.campo); as erro) {
                    <mat-error>{{ erro }}</mat-error>
                    }
                </mat-form-field>
                }
            </mat-card-content>

            <mat-card-actions align="end" class="flex items-center justify-end gap-3 pt-4">
                <a mat-stroked-button routerLink="/inicio" class="px-4">Voltar</a>

                <button type="submit" [disabled]="configuracaoForm.invalid" mat-flat-button class="px-6">
                    <mat-icon class="!text-base mr-1">check</mat-icon>
                    Salvar
                </button>
            </mat-card-actions>
        </form>
    </mat-card>
</section>
