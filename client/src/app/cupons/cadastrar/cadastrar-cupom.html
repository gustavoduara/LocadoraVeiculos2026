<section class="mx-auto max-w-4xl px-4 py-6">
    <h2 class="text-2xl font-semibold">Cadastro de Cupom</h2>
    <hr class="my-4 border-muted/30" />

    <mat-card class="p-4 rounded-2xl shadow-sm">
        @if (parceiros.length === 0) {
        <mat-card-content>
            <p class="text-gray-700">Antes de cadastrar um cupom é preciso ter pelo menos um parceiro.</p>
            <div class="flex justify-end gap-3 pt-4">
                <a mat-stroked-button routerLink="/cupons">Voltar</a>
                <a mat-flat-button routerLink="/parceiros/cadastrar">Cadastrar parceiro</a>
            </div>
        </mat-card-content>
        } @else {
        <mat-card-content>
            <app-cupom-form [parceiros]="parceiros" (salvar)="cadastrar($event)" />
        </mat-card-content>
        }
    </mat-card>
</section>
