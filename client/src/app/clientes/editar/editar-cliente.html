<section class="mx-auto max-w-4xl px-4 py-6">
    <h2 class="text-2xl font-semibold">Edição de Cliente</h2>
    <hr class="my-4 border-muted/30" />

    <mat-card class="p-4 rounded-2xl shadow-sm">
        <mat-card-content>
            <app-cliente-form [cliente]="cliente" [pessoasJuridicas]="pessoasJuridicas" (salvar)="editar($event)" />
        </mat-card-content>
    </mat-card>
</section>
