<section class="mx-auto max-w-4xl px-4 py-6">
    <h2 class="text-2xl font-semibold">{{ cliente.contaOnline ? 'Dados do Cliente' : 'Edição de Cliente' }}</h2>
    <hr class="my-4 border-muted/30" />

    @if (cliente.contaOnline) {
    <p class="mb-4 flex items-start gap-2 rounded-lg px-4 py-3 text-sm selo-ambar">
        <mat-icon class="shrink-0">lock</mat-icon>
        <span>
            Este cliente se cadastrou pela conta própria. Só ele altera os dados (em "Meus dados"); a locadora apenas
            consulta.
        </span>
    </p>
    }

    <mat-card class="p-4 rounded-2xl shadow-sm">
        <mat-card-content>
            <app-cliente-form [cliente]="cliente" [somenteLeitura]="!!cliente.contaOnline" [pessoasJuridicas]="pessoasJuridicas" (salvar)="editar($event)" />
        </mat-card-content>
    </mat-card>
</section>
