<section class="mx-auto max-w-4xl px-4 py-6">

    <hr class="my-4 border-muted/30" />

    <mat-card class="p-4 rounded-2xl shadow-sm">
        <mat-card-content>
            <app-automovel-form [grupos]="grupos" [automovel]="automovel" (salvar)="editar($event)" />
        </mat-card-content>
    </mat-card>
</section>
