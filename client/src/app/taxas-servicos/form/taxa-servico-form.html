<form [formGroup]="form" (ngSubmit)="enviar()" class="space-y-4">
    <mat-form-field class="w-full">
        <mat-label>Nome</mat-label>
        <input matInput formControlName="nome" placeholder="Ex.: GPS, cadeirinha de bebê, tanque cheio" />
        @if (erroDo('nome'); as erro) { <mat-error>{{ erro }}</mat-error> }
    </mat-form-field>

    <mat-form-field class="w-full sm:w-64">
        <mat-label>Preço</mat-label>
        <span matTextPrefix>R$&nbsp;</span>
        <input matInput type="number" step="0.01" min="0.01" formControlName="preco" />
        @if (erroDo('preco'); as erro) { <mat-error>{{ erro }}</mat-error> }
    </mat-form-field>

    <fieldset class="rounded-xl border border-gray-300 p-4">
        <legend class="px-2 text-sm font-medium">Plano de cobrança</legend>

        <mat-radio-group formControlName="tipoCobranca" class="flex flex-col sm:flex-row gap-4">
            @for (tipo of tipos; track tipo.valor) {
            <mat-radio-button [value]="tipo.valor">
                <span class="font-medium">{{ tipo.rotulo }}</span>
                <span class="block text-xs text-gray-500">{{ tipo.descricao }}</span>
            </mat-radio-button>
            }
        </mat-radio-group>
    </fieldset>

    <div class="flex items-center justify-end gap-3 pt-4">
        <a mat-stroked-button routerLink="/taxas-servicos" class="px-4">Voltar</a>

        <button type="submit" mat-flat-button class="px-6">
            <mat-icon class="!text-base mr-1">check</mat-icon>
            {{ edicao ? 'Salvar' : 'Concluir' }}
        </button>
    </div>
</form>
