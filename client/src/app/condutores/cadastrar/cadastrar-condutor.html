<section class="mx-auto max-w-4xl px-4 py-6">
    <h2 class="text-2xl font-semibold">Cadastro de Condutor</h2>
    <hr class="my-4 border-muted/30" />

    <mat-card class="p-4 rounded-2xl shadow-sm">
        @if (clientes.length === 0) {
        <mat-card-content>
            <p class="text-gray-700">Antes de cadastrar um condutor é preciso ter pelo menos um cliente.</p>
            <div class="flex justify-end gap-3 pt-4">
                <a mat-stroked-button routerLink="/condutores">Voltar</a>
                <a mat-flat-button routerLink="/clientes/cadastrar">Cadastrar cliente</a>
            </div>
        </mat-card-content>
        } @else {
        <mat-card-content>
            <app-condutor-form [clientes]="clientes" (salvar)="cadastrar($event)" />
        </mat-card-content>
        }
    </mat-card>
</section>
