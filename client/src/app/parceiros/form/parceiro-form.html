<form [formGroup]="form" (ngSubmit)="enviar()" class="space-y-4">
    <mat-form-field class="w-full">
        <mat-label>Nome do parceiro</mat-label>
        <input matInput formControlName="nome" placeholder="Ex.: Hotel Central, Agência Sol" />
        @if (erroDo('nome'); as erro) { <mat-error>{{ erro }}</mat-error> }
    </mat-form-field>

    <div class="flex items-center justify-end gap-3 pt-4">
        <a mat-stroked-button routerLink="/parceiros" class="px-4">Voltar</a>

        <button type="submit" mat-flat-button class="px-6">
            <mat-icon class="!text-base mr-1">check</mat-icon>
            {{ edicao ? 'Salvar' : 'Concluir' }}
        </button>
    </div>
</form>
